<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 250px;
      padding: 15px;
      margin: 0;
      background-color: #1a1a1a;
      color: #fff;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #93c5fd;
    }
    p {
      font-size: 13px;
      color: #a3a3a3;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    button:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 15px;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h2>Worklogger Sync</h2>
  <p>Make sure you are logged into SDP, then click below to sync your session to your local app.</p>
  
  <button id="syncBtn">Sync Session</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>

    <!-- Star 5: 8-dot Diamond Sparkler (65, 190) -->
    <rect x='66' y='186' width='2' height='2'/>
    <rect x='66' y='194' width='2' height='2'/>
    <rect x='62' y='190' width='2' height='2'/>
    <rect x='70' y='190' width='2' height='2'/>
    <rect x='64' y='188' width='1' height='1'/>
    <rect x='69' y='188' width='1' height='1'/>
    <rect x='64' y='193' width='1' height='1'/>
    <rect x='69' y='193' width='1' height='1'/>

    <!-- Star 6: Medium Cross Star (160, 20) -->
    <rect x='158' y='20' width='5' height='1'/>
    <rect x='160' y='18' width='1' height='5'/>

    <!-- Star 7: Cross Star (25, 120) -->
    <rect x='23' y='120' width='5' height='1'/>
    <rect x='25' y='118' width='1' height='5'/>

    <!-- Star 8: Cross Star (235, 35) -->
    <rect x='233' y='35' width='5' height='1'/>
    <rect x='235' y='33' width='1' height='5'/>

    <!-- Small Pixel Dots -->
    <rect x='90' y='85' width='2' height='2' opacity='0.9'/>
    <rect x='230' y='115' width='2' height='2' opacity='0.95'/>
    <rect x='15' y='230' width='2' height='2' opacity='0.85'/>
    <rect x='140' y='235' width='2' height='2' opacity='0.9'/>
    <rect x='205' y='10' width='2' height='2' opacity='0.8'/>
    <rect x='105' y='30' width='1' height='1' opacity='0.75'/>
    <rect x='15' y='10' width='1' height='1' opacity='0.7'/>
    <rect x='95' y='210' width='1' height='1' opacity='0.75'/>
    <rect x='170' y='125' width='1' height='1' opacity='0.8'/>
    <rect x='245' y='230' width='1' height='1' opacity='0.7'/>
    <rect x='5' y='160' width='1' height='1' opacity='0.8'/>
    <rect x='110' y='105' width='1' height='1' opacity='0.7'/>

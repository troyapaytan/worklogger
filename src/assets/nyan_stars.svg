    <rect x='185' y='65' width='2' height='2'/>
    <rect x='179' y='63' width='1' height='1'/>
    <rect x='184' y='63' width='1' height='1'/>
    <rect x='179' y='68' width='1' height='1'/>
    <rect x='184' y='68' width='1' height='1'/>

    <!-- Star 3: Medium Cross Star (130, 150) -->
    <rect x='128' y='150' width='5' height='1'/>
    <rect x='130' y='148' width='1' height='5'/>
    <rect x='129' y='149' width='3' height='3'/>


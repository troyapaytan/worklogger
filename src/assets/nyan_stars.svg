<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256' viewBox='0 0 256 256'>
  <!-- Authentic Nyan Cat Starfield -->
  <g fill='#ffffff' shape-rendering='crispEdges'>
    <!-- Star 1: Large Cross Star (40, 45) -->
    <rect x='37' y='45' width='7' height='1'/>
    <rect x='40' y='42' width='1' height='7'/>
    <rect x='39' y='44' width='3' height='3'/>

    <!-- Star 2: 8-dot Diamond Sparkler (180, 65) -->
    <rect x='181' y='61' width='2' height='2'/>
    <rect x='181' y='69' width='2' height='2'/>
